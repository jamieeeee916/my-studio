function formatDateWithWeekday(value){

  const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));

document.getElementById("brand-name").textContent=BRAND.name;document.getElementById("brand-mark").textContent=`${BRAND.name}｜LONTIAN, LUYE`;document.getElementById("brand-account").textContent=`帳號名稱｜${BRAND.accountName}`;document.documentElement.style.setProperty("--forest",BRAND.primaryColor);
brandSpecInput.value=localStorage.getItem(STORAGE_KEYS.brandSpec)||"";checklistInput.value=localStorage.getItem(STORAGE_KEYS.checklist)||"";
BRAND.materialFields.forEach((field,index)=>{const wrapper=document.createElement("div"),inputId=`material-${index}`,label=document.createElement("label"),input=document.createElement(field.type==="textarea"?"textarea":"input");wrapper.className="field";label.htmlFor=inputId;label.append(field.label);if(field.required){const required=document.createElement("span");required.className="required";required.textContent="必填";label.append(required)}input.id=inputId;input.name=inputId;input.placeholder=field.placeholder;input.required=field.required;if(field.type!=="textarea")input.type="text";if(index===0)input.addEventListener("input",renderPreview);input.addEventListener("input",persistDraft);materialInputs.push(input);wrapper.append(label,input);materialForm.append(wrapper)});
BRAND.platforms.forEach((platform,index)=>{const button=document.createElement("button");button.type="button";button.dataset.platform=platform;button.className=`platform-tab${index===0?" is-active":""}`;button.textContent=platform;button.setAttribute("aria-pressed",String(index===0));button.addEventListener("click",()=>switchPlatform(platform));platformTabs.append(button)});
postContent.addEventListener("input",()=>{posts[currentPlatform]=postContent.value;wordCount.textContent=postContent.value.length+" 字";renderPreview();persistDraft()});
imageInput.addEventListener("change",handleImageUpload);
document.getElementById("save-post").addEventListener("click",saveCurrentPost);
document.getElementById("new-post").addEventListener("click",startNewPost);
document.getElementById("open-library").addEventListener("click",()=>{renderSavedList();openModal(libraryModal)});
document.getElementById("open-settings").addEventListener("click",()=>openModal(settingsModal));
document.getElementById("save-settings").addEventListener("click",()=>{localStorage.setItem(STORAGE_KEYS.brandSpec,brandSpecInput.value);localStorage.setItem(STORAGE_KEYS.checklist,checklistInput.value);closeModal(settingsModal)});
document.getElementById("compose-prompt").addEventListener("click",()=>{promptOutput.value=buildPrompt();openModal(promptModal)});
document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",()=>closeModal(document.getElementById(button.dataset.close))));
document.querySelectorAll(".modal-backdrop").forEach(modal=>modal.addEventListener("click",event=>{if(event.target===modal)closeModal(modal)}));
document.getElementById("copy-prompt").addEventListener("click",async event=>{try{await navigator.clipboard.writeText(promptOutput.value)}catch(error){promptOutput.select();document.execCommand("copy")}event.currentTarget.textContent="已複製";setTimeout(()=>{event.currentTarget.textContent="複製"},1200)});
renderImageControl();restoreDraft();renderPreview();
</script>
</body>
</html>
